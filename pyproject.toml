[project]
name = "notebook"
version = "0.0.0"
description = "TimeDegree's MkDocs Material notebook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.49",
    "mkdocs-rss-plugin>=1.19.0",
    "mkdocs-statistics-plugin>=0.1.5",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-changelog-plugin>=0.1.3",
    "mkdocs-toc-plugin",
    "jieba>=0.42.1",
    "pillow>=11.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mkdocs-toc-plugin = { path = "plugins/mkdocs-toc-plugin", editable = true }
